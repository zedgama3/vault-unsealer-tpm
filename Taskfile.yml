# yaml-language-server: $schema=https://taskfile.dev/schema.json
# https://taskfile.dev
version: "3"

vars:
  BIN_DIR: bin
  MODULE:
    sh: go list -m

tasks:
  default:
    desc: List all available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: Build the binary into ./bin/
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/vault-unsealer-tpm ./cmd/unseal
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BIN_DIR}}/vault-unsealer-tpm"

  build-docker:
    desc: Build the Docker image tagged as vault-unsealer-tpm:dev
    cmds:
      - docker build -f .docker/Dockerfile -t vault-unsealer-tpm:dev .

  test:
    desc: Run all unit tests
    cmds:
      - go test ./...

  test-integration:
    desc: Run TPM integration tests (requires a real TPM device and privileges)
    cmds:
      - go test -tags tpm_integration ./...

  lint:
    desc: Format code and run golangci-lint
    cmds:
      - gofmt -w .
      - go run github.com/golangci/golangci-lint/cmd/golangci-lint@latest run ./...

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}
